[package]
publish = false
name = "kiqi-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Host-side wasm (component model) plugin backend for kiqi"
readme = "README.md"
keywords = ["ki", "kiqi", "wasm", "plugin", "component-model"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
kiqi-plugin = { path = "../kiqi-plugin" }
wasmtime = { version = "49", features = ["component-model"] }
wasmtime-wasi = "49"
wasmparser = "0.259"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
tempfile = { workspace = true }

# Killing a child's whole process group (see `run_with_limits`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
