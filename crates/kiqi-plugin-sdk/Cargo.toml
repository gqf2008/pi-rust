[package]
publish = false
name = "kiqi-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-plugin-sdk"
description = "Stable #[repr(C)] ABI contract for ki Rust-native (cdylib) plugins — no kiqi-* deps"
readme = "README.md"
keywords = ["agent", "llm", "ai", "plugin", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
# Transitional: the ABI layer borrows the canonical EventTag. The whole
# crate goes away with the cdylib channel (P6).
kiqi-plugin = { path = "../kiqi-plugin" }
# Core FFI types are zero-dep (std only). JSON round-trip helpers for
# `StableJsonValue` / `StableToolSchema.parameters` pull serde_json, gated behind
# the `json` feature (default on). A plugin that wants to avoid the dep can
# disable default features and do its own (de)serialization.
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["json"]
json = ["dep:serde_json"]
process = ["dep:windows-sys", "dep:libc"]
stdio = ["dep:windows-sys", "dep:libc"]
