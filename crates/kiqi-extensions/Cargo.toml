[package]
publish = false
name = "kiqi-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-extensions"
description = "Host-side extension dispatch spine for ki — registry, event funnels, compiled/wasm sink, action mailboxes"
readme = "README.md"
keywords = ["agent", "llm", "ai", "plugin", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[dependencies]
kiqi-plugin = { workspace = true }
kiqi-ai = { workspace = true }
kiqi-agent = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tempfile = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
