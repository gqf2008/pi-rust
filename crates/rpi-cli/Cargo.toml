[package]
publish = false
name = "rpi-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rpi-cli"
description = "Terminal coding-agent CLI (the `rpi` binary) built on the rpi-* library crates"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "cli"]
categories = [
    "command-line-interface",
    "api-bindings",
    "development-tools",
    "artificial-intelligence",
]

[dependencies]
kiqi-plugin = { path = "../kiqi-plugin" }
kiqi-plugin-host = { path = "../kiqi-plugin-host", optional = true }
rpi-todo = { path = "../../plugins/rpi-todo", optional = true, features = ["compile-time"] }
rpi-lens = { path = "../../plugins/rpi-lens", optional = true, features = ["compile-time"] }
rpi-orchestrator = { path = "../../plugins/rpi-orchestrator", optional = true, features = ["compile-time"] }
rpi-webfetch = { path = "../../plugins/rpi-webfetch", optional = true, features = ["compile-time"] }
rpi-websearch = { path = "../../plugins/rpi-websearch", optional = true, features = ["compile-time"] }
rpi-subagents = { path = "../../plugins/rpi-subagents", optional = true, features = ["compile-time"] }
rpi-permissions = { path = "../../plugins/rpi-permissions", optional = true, features = ["compile-time"] }
rpi-goal = { path = "../../plugins/rpi-goal", optional = true, features = ["compile-time"] }
rpi-plan-mode = { path = "../../plugins/rpi-plan-mode", optional = true, features = ["compile-time"] }
rpi-codegraph = { path = "../../plugins/rpi-codegraph", optional = true, features = ["compile-time"] }
rpi-ask-user = { path = "../../plugins/rpi-ask-user", optional = true, features = ["compile-time"] }
rpi-langfuse = { path = "../../plugins/rpi-langfuse", optional = true, features = ["compile-time"] }
rpi-telemetry = { workspace = true }
rpi-ai = { workspace = true, features = ["providers"] }
rpi-agent = { workspace = true }
rpi-tools = { workspace = true }
rpi-harness = { workspace = true }
rpi-tui = { workspace = true }
rpi-plugin-sdk = { workspace = true }
rpi-extensions = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "net"] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rpassword = { workspace = true }
tempfile = { workspace = true }
crossterm = { version = "0.27", features = ["events"] }
base64 = { workspace = true }
png = { workspace = true }
# arboard 3.x does not build on Android/Termux (no `Clipboard` in `platform`).
# Gate the dep to non-Android targets so `cargo install` on Termux still works;
# the `clipboard` feature becomes a harmless no-op there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
# `nix::sys::signal::raise` for the Ctrl+Z suspend (`app.suspend`).
nix = { version = "0.29", features = ["signal", "poll"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall rpi-cli` support. The release workflow publishes
# `rpi-v<version>-<target>.tar.gz` (`.zip` on Windows) with the `rpi` binary at
# the archive root, plus a sibling `.sha256`. The URL has to be built from
# `{ bin }` rather than `{ name }`, because the assets are named after the
# binary (`rpi`) while the crate is `rpi-cli`. Default `pkg-fmt` is `tgz`; only
# the Windows target needs the zip override.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# Only the plugins without a wasm port stay compiled in by default: every
# `plugins/rpi-*` that has a `plugins/wasm/kiqi-*-guest` counterpart is opt-in
# now (`--features plugin-rpi-<name>`, or install the wasm guest with
# `ki insmod`). The crates, their features, their cdylib faces and their tests
# all stay; CI builds every one of them so none rots.
default = ["clipboard", "plugin-wasm", "plugin-rpi-orchestrator", "plugin-rpi-permissions"]
# Loads `plugins/<id>/plugin.wasm` through `kiqi-plugin-host` (wasmtime). Off
# only for builds that want the leaner binary without the wasm tier.
plugin-wasm = ["dep:kiqi-plugin-host"]
# Enables real clipboard support for `/copy` and image paste (best-effort).
clipboard = ["dep:arboard"]
# First-party plugins are compiled in. The cdylib channel keeps serving `ki dev`.
plugin-rpi-todo = ["dep:rpi-todo"]
plugin-rpi-lens = ["dep:rpi-lens"]
plugin-rpi-orchestrator = ["dep:rpi-orchestrator"]
plugin-rpi-webfetch = ["dep:rpi-webfetch"]
plugin-rpi-websearch = ["dep:rpi-websearch"]
plugin-rpi-subagents = ["dep:rpi-subagents"]
plugin-rpi-permissions = ["dep:rpi-permissions"]
plugin-rpi-goal = ["dep:rpi-goal"]
plugin-rpi-plan-mode = ["dep:rpi-plan-mode"]
plugin-rpi-codegraph = ["dep:rpi-codegraph"]
plugin-rpi-ask-user = ["dep:rpi-ask-user"]
# Not in `default`: the tracing tier targets a Langfuse instance, and a user who
# wants it turns it on explicitly. Kept (and CI-checked) rather than removed so
# the compiled path keeps compiling.
plugin-rpi-langfuse = ["dep:rpi-langfuse"]

[dev-dependencies]
# `term` is only needed by the pty-based tui_hangup regression test; keeping it
# out of the normal feature set keeps the shipped binary lean.
nix = { version = "0.29", features = ["term", "fs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ki"
path = "src/bin/ki.rs"
