[package]
publish = false
name = "kiqi-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-tui"
description = "Terminal UI primitives for the ki coding agent: components, layout, editor, transcript rendering"
readme = "README.md"
keywords = ["agent", "llm", "ai", "terminal", "tui"]
categories = ["command-line-interface", "api-bindings"]

[dependencies]
crossterm = { version = "0.27", features = ["events", "bracketed-paste"] }
unicode-width = "0.1"
unicode-segmentation = "1"
thiserror.workspace = true
tracing.workspace = true
regex = "1"
base64 = "0.22"
similar = { version = "2", features = ["text", "unicode"] }
pulldown-cmark = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "winbase", "wincon", "winuser"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
