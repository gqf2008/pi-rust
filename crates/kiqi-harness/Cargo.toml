[package]
publish = false
name = "kiqi-harness"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-harness"
description = "Session tree + JSONL persistence + compaction + AgentHarness loop, Rust port of pi harness layer"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "harness"]
categories = ["api-bindings", "asynchronous", "artificial-intelligence"]

[dependencies]
kiqi-telemetry = { workspace = true }
kiqi-ai = { workspace = true }
kiqi-agent = { workspace = true }
kiqi-tools = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
kiqi-telemetry = { workspace = true }
kiqi-ai = { workspace = true }
kiqi-agent = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
