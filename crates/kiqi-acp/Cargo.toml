[package]
name = "kiqi-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors = ["高庆丰 <gao.qingfeng@gmail.com>"]
repository = "https://github.com/gqf2008/pi-rust"
description = "ki acp serve — a host-level Agent Client Protocol server"

[dependencies]
kiqi-ai = { workspace = true }
kiqi-agent = { workspace = true }
kiqi-harness = { workspace = true }
kiqi-mcp = { workspace = true }
kiqi-host = { workspace = true }
agent-client-protocol = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "net"] }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Session-storage fixtures build real `JsonlSessionRepo`s over `OsExecutionEnv`.
kiqi-tools = { workspace = true }
