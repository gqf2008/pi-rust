[package]
publish = false
name = "kiqi-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-cli"
description = "Terminal coding-agent CLI (the `ki` binary) built on the kiqi-* library crates"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "cli"]
categories = [
    "command-line-interface",
    "api-bindings",
    "development-tools",
    "artificial-intelligence",
]

[dependencies]
kiqi-telemetry = { workspace = true }
kiqi-ai = { workspace = true, features = ["providers"] }
kiqi-agent = { workspace = true }
agent-client-protocol = { workspace = true }
kiqi-tools = { workspace = true }
kiqi-harness = { workspace = true }
kiqi-tui = { workspace = true }
kiqi-host = { workspace = true }
kiqi-mcp = { workspace = true }
kiqi-acp = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "net"] }
tokio-util = { workspace = true, features = ["compat"] }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rpassword = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
crossterm = { version = "0.27", features = ["events"] }
base64 = { workspace = true }
png = { workspace = true }
# arboard 3.x does not build on Android/Termux (no `Clipboard` in `platform`).
# Gate the dep to non-Android targets so `cargo install` on Termux still works;
# the `clipboard` feature becomes a harmless no-op there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
# `nix::sys::signal::raise` for the Ctrl+Z suspend (`app.suspend`).
nix = { version = "0.29", features = ["signal", "poll", "fs"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall kiqi-cli` support. The release workflow publishes
# `kiqi-v<version>-<target>.tar.gz` (`.zip` on Windows) with the `ki` binary at
# the archive root, plus a sibling `.sha256`. The URL has to be built from
# `{ bin }` rather than `{ name }`, because the assets are named after the
# binary (`ki`) while the crate is `kiqi-cli`. Default `pkg-fmt` is `tgz`; only
# the Windows target needs the zip override.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# First-party extensions are wasm guests only (`extensions/wasm/kiqi-*`,
# installed with `ki insmod`). The compiled-in channel was retired on
# 2026-10-21: its crates, `extension-kiqi-*` features and cdylib CI builds are
# gone. The cdylib channel was retired on 2026-10-26 (`ki dev`/`ki install`/
# `kiqi-extension-sdk` removed); wasm is the only extension channel.
default = ["clipboard", "extension-wasm"]
# Loads `extensions/<id>/extension.wasm` through `kiqi-extension-host` (wasmtime). Off
# only for builds that want the leaner binary without the wasm tier.
extension-wasm = ["kiqi-host/wasm"]
# Enables real clipboard support for `/copy` and image paste (best-effort).
clipboard = ["dep:arboard"]

[dev-dependencies]
# `term` is only needed by the pty-based tui_hangup regression test; keeping it
# out of the normal feature set keeps the shipped binary lean.
nix = { version = "0.29", features = ["term", "fs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ki"
path = "src/bin/ki.rs"

[lints.rust]
# The compiled-in extension channel was retired; its historical test blocks still
# carry `#[cfg(feature = "extension-kiqi-*")]`. Those features are gone, so the
# blocks never compile, but telling check-cfg the names keeps the warnings
# meaningful rather than "unknown feature value".
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(feature, values("extension-kiqi-todo", "extension-kiqi-lens", "extension-kiqi-orchestrator", "extension-kiqi-webfetch", "extension-kiqi-websearch", "extension-kiqi-subagents", "extension-kiqi-permissions", "extension-kiqi-goal", "extension-kiqi-plan-mode", "extension-kiqi-codegraph", "extension-kiqi-ask-user", "extension-kiqi-langfuse"))',
] }
