[package]
publish = false
name = "kiqi-cli"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-cli"
description = "Terminal coding-agent CLI (the `ki` binary) built on the kiqi-* library crates"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "cli"]
categories = [
    "command-line-interface",
    "api-bindings",
    "development-tools",
    "artificial-intelligence",
]

[dependencies]
kiqi-plugin = { path = "../kiqi-plugin" }
kiqi-plugin-host = { path = "../kiqi-plugin-host", optional = true }
kiqi-todo = { path = "../../plugins/kiqi-todo", optional = true, features = ["compile-time"] }
kiqi-lens = { path = "../../plugins/kiqi-lens", optional = true, features = ["compile-time"] }
kiqi-orchestrator = { path = "../../plugins/kiqi-orchestrator", optional = true, features = ["compile-time"] }
kiqi-webfetch = { path = "../../plugins/kiqi-webfetch", optional = true, features = ["compile-time"] }
kiqi-websearch = { path = "../../plugins/kiqi-websearch", optional = true, features = ["compile-time"] }
kiqi-subagents = { path = "../../plugins/kiqi-subagents", optional = true, features = ["compile-time"] }
kiqi-permissions = { path = "../../plugins/kiqi-permissions", optional = true, features = ["compile-time"] }
kiqi-goal = { path = "../../plugins/kiqi-goal", optional = true, features = ["compile-time"] }
kiqi-plan-mode = { path = "../../plugins/kiqi-plan-mode", optional = true, features = ["compile-time"] }
kiqi-codegraph = { path = "../../plugins/kiqi-codegraph", optional = true, features = ["compile-time"] }
kiqi-ask-user = { path = "../../plugins/kiqi-ask-user", optional = true, features = ["compile-time"] }
kiqi-langfuse = { path = "../../plugins/kiqi-langfuse", optional = true, features = ["compile-time"] }
kiqi-telemetry = { workspace = true }
kiqi-ai = { workspace = true, features = ["providers"] }
kiqi-agent = { workspace = true }
agent-client-protocol = { workspace = true }
kiqi-tools = { workspace = true }
kiqi-harness = { workspace = true }
kiqi-tui = { workspace = true }
kiqi-plugin-sdk = { workspace = true }
kiqi-extensions = { workspace = true }
kiqi-mcp = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std", "net"] }
tokio-util = { workspace = true, features = ["compat"] }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
indexmap = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
rpassword = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
crossterm = { version = "0.27", features = ["events"] }
base64 = { workspace = true }
png = { workspace = true }
# arboard 3.x does not build on Android/Termux (no `Clipboard` in `platform`).
# Gate the dep to non-Android targets so `cargo install` on Termux still works;
# the `clipboard` feature becomes a harmless no-op there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
# `nix::sys::signal::raise` for the Ctrl+Z suspend (`app.suspend`).
nix = { version = "0.29", features = ["signal", "poll"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

# `cargo binstall kiqi-cli` support. The release workflow publishes
# `kiqi-v<version>-<target>.tar.gz` (`.zip` on Windows) with the `ki` binary at
# the archive root, plus a sibling `.sha256`. The URL has to be built from
# `{ bin }` rather than `{ name }`, because the assets are named after the
# binary (`ki`) while the crate is `kiqi-cli`. Default `pkg-fmt` is `tgz`; only
# the Windows target needs the zip override.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# Only the plugins without a wasm port stay compiled in by default: every
# `plugins/kiqi-*` that has a `plugins/wasm/kiqi-*-guest` counterpart is opt-in
# now (`--features plugin-kiqi-<name>`, or install the wasm guest with
# `ki insmod`). The crates, their features, their cdylib faces and their tests
# all stay; CI builds every one of them so none rots.
default = ["clipboard", "plugin-wasm", "plugin-kiqi-permissions"]
# Loads `plugins/<id>/plugin.wasm` through `kiqi-plugin-host` (wasmtime). Off
# only for builds that want the leaner binary without the wasm tier.
plugin-wasm = ["dep:kiqi-plugin-host"]
# Enables real clipboard support for `/copy` and image paste (best-effort).
clipboard = ["dep:arboard"]
# First-party plugins are compiled in. The cdylib channel keeps serving `ki dev`.
plugin-kiqi-todo = ["dep:kiqi-todo"]
plugin-kiqi-lens = ["dep:kiqi-lens"]
plugin-kiqi-orchestrator = ["dep:kiqi-orchestrator"]
plugin-kiqi-webfetch = ["dep:kiqi-webfetch"]
plugin-kiqi-websearch = ["dep:kiqi-websearch"]
plugin-kiqi-subagents = ["dep:kiqi-subagents"]
plugin-kiqi-permissions = ["dep:kiqi-permissions"]
plugin-kiqi-goal = ["dep:kiqi-goal"]
plugin-kiqi-plan-mode = ["dep:kiqi-plan-mode"]
plugin-kiqi-codegraph = ["dep:kiqi-codegraph"]
plugin-kiqi-ask-user = ["dep:kiqi-ask-user"]
# Not in `default` either: has a wasm port now (see `plugin-kiqi-langfuse`
# below for the same shape).

# Not in `default`: the tracing tier targets a Langfuse instance, and a user who
# wants it turns it on explicitly. Kept (and CI-checked) rather than removed so
# the compiled path keeps compiling.
plugin-kiqi-langfuse = ["dep:kiqi-langfuse"]

[dev-dependencies]
# `term` is only needed by the pty-based tui_hangup regression test; keeping it
# out of the normal feature set keeps the shipped binary lean.
nix = { version = "0.29", features = ["term", "fs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ki"
path = "src/bin/ki.rs"
