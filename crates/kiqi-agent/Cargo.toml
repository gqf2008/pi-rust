[package]
publish = false
name = "kiqi-agent"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kiqi-agent"
description = "Agent runtime and loop: tools, events, hooks, queues, cancellation"
readme = "README.md"
keywords = ["agent", "llm", "ai", "claude", "sdk"]
categories = ["api-bindings", "asynchronous", "artificial-intelligence"]

[dependencies]
kiqi-telemetry = { workspace = true }
kiqi-ai = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
