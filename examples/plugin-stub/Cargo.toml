[package]
name = "plugin-stub"
version = "0.1.11"
edition = "2021"
publish = false
description = "Minimal ki Rust-cdylib plugin: registers an `echo` tool + one event handler (the Part B2 ABI smoke target)."

[lib]
# cdylib so the host can load it via libloading as kiqi_plugin_register_v2.
crate-type = ["cdylib"]

[dependencies]
kiqi-plugin-sdk = { workspace = true }
serde_json = { workspace = true }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
#
# `export_plugin!` emits `#[cfg(not(feature = "compile-time"))]` *inside this
# crate*, so a plugin that does not declare this feature always exports the
# entrypoint (`cargo` warns `unexpected cfg condition value`) and cannot be
# linked into `ki` at all. Every plugin under `plugins/` declares it; this
# example — which exists to be copied — did not.
compile-time = []
