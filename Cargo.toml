# ki — a Rust agent runtime + CLI. See README.md and docs/architecture/overview.md.
[workspace]
members = [
    "crates/kiqi-telemetry",
    "crates/kiqi-ai",
    "crates/kiqi-agent",
    "crates/kiqi-tools",
    "crates/kiqi-harness",
    "crates/kiqi-cli",
    "crates/kiqi-acp",
    "crates/kiqi-tui",
    "crates/kiqi-host",
    "crates/kiqi-mcp",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
]
default-members = [
    "crates/kiqi-agent",
    "crates/kiqi-tools",
    "crates/kiqi-harness",
    "crates/kiqi-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
# 1.96, not 1.78: `wasmtime = 49` (crates/kiqi-extension-host) pulls
# cranelift-assembler-x64 0.136.2, which declares `rust-version = "1.96.0"`;
# cargo refuses to resolve the workspace below that. Verified by building the
# whole workspace on 1.94 (fails: "not supported by the following packages"),
# 1.96 (passes) and 1.98 (passes). The old 1.78 was never re-checked after
# wasmtime entered the tree — docs/design/ki-mcp-builtin.md already recorded that
# it was stale.
#
# Written as `1.96`, not `1.96.0`: rustup reads a two-part version as "the newest
# patch of that minor", so the CI `msrv` job accepts any 1.96.x. That is the intent
# — a patch release must not falsify the declaration — while `1.96.0` would pin one
# exact patch. Checked with `rustup run 1.96 rustc --version` → 1.96.1, whereas
# `1.96.0` is a separate, uninstalled toolchain.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/gqf2008/pi-rust"
homepage = "https://ki.laofu.online/"
version = "0.4.7"
authors = ["BigFish <bigfish1913@gmail.com>"]

[workspace.dependencies]
wait-timeout = "0.2"
url = "2"
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
agent-client-protocol = { version = "=3.3.0", features = ["stdio"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# ki internal crates (package names and directories both use the `kiqi-` prefix).
kiqi-telemetry = { path = "crates/kiqi-telemetry", version = "0.4.7" }
kiqi-ai = { path = "crates/kiqi-ai", version = "0.4.7" }
kiqi-agent = { path = "crates/kiqi-agent", version = "0.4.7" }
kiqi-tools = { path = "crates/kiqi-tools", version = "0.4.7" }
kiqi-harness = { path = "crates/kiqi-harness", version = "0.4.7" }

kiqi-tui = { path = "crates/kiqi-tui", version = "0.4.7" }

kiqi-host = { path = "crates/kiqi-host", version = "0.4.7" }
kiqi-mcp = { path = "crates/kiqi-mcp", version = "0.4.7" }
kiqi-acp = { path = "crates/kiqi-acp", version = "0.4.7" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
