# ki — a Rust agent runtime + CLI. See README.md and docs/architecture/overview.md.
[workspace]
members = [
    "crates/kiqi-plan-mode-core",
    "crates/kiqi-telemetry",
    "crates/kiqi-ai",
    "crates/kiqi-agent",
    "crates/kiqi-tools",
    "crates/kiqi-harness",
    "crates/kiqi-cli",
    "crates/kiqi-tui",
    "crates/kiqi-plugin",
    "crates/kiqi-plugin-host",
    "plugins/kiqi-todo",
    "plugins/kiqi-goal",
    "plugins/kiqi-plan-mode",
    "plugins/kiqi-codegraph",
    "plugins/kiqi-ask-user",
    "plugins/kiqi-langfuse",
    "plugins/kiqi-subagents",
    "plugins/kiqi-permissions",
    "plugins/kiqi-lens",
    "plugins/kiqi-orchestrator",
    "plugins/kiqi-webfetch",
    "plugins/kiqi-websearch",
    "crates/kiqi-plugin-sdk",
    "crates/kiqi-mcp",
    "crates/kiqi-extensions",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
    "examples/plugin-stub",
]
default-members = [
    "crates/kiqi-agent",
    "crates/kiqi-tools",
    "crates/kiqi-harness",
    "crates/kiqi-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/bigfish1913/pi-rust"
homepage = "https://ki.laofu.online/"
version = "0.4.1"
authors = ["BigFish <bigfish1913@gmail.com>"]

[workspace.dependencies]
wait-timeout = "0.2"
url = "2"
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
agent-client-protocol = { version = "=3.3.0", features = ["stdio"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# ki internal crates (package names and directories both use the `kiqi-` prefix).
kiqi-telemetry = { path = "crates/kiqi-telemetry", version = "0.4.1" }
kiqi-ai = { path = "crates/kiqi-ai", version = "0.4.1" }
kiqi-agent = { path = "crates/kiqi-agent", version = "0.4.1" }
kiqi-tools = { path = "crates/kiqi-tools", version = "0.4.1" }
kiqi-harness = { path = "crates/kiqi-harness", version = "0.4.1" }

kiqi-tui = { path = "crates/kiqi-tui", version = "0.4.1" }

kiqi-plugin-sdk = { path = "crates/kiqi-plugin-sdk", version = "0.4.1" }
kiqi-extensions = { path = "crates/kiqi-extensions", version = "0.4.1" }
kiqi-mcp = { path = "crates/kiqi-mcp", version = "0.4.1" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
