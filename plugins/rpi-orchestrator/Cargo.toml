[package]
publish = false
name = "rpi-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded DAG subagent orchestration plugin for ki"
readme = "README.md"
keywords = ["rpi", "kiqi", "subagent", "orchestration", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
rpi-plugin-sdk = { path = "../../crates/rpi-plugin-sdk" }
serde_json = { workspace = true }
wait-timeout = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Kill the child's whole process group so a subagent's descendants (e.g. a
# background `sleep`) do not survive as orphans when we cancel.
nix = { version = "0.29", features = ["process", "signal"] }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
compile-time = []
