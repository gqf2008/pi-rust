[package]
publish = false
name = "rpi-subagents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded delegation envelope tool for rpi Rust agents"
readme = "README.md"
keywords = ["rpi", "subagents", "delegation", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
rpi-plugin-sdk = { path = "../../crates/rpi-plugin-sdk" }
serde_json = { workspace = true }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
compile-time = []
