[package]
publish = false
name = "rpi-goal"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Codex-style goal mode for the rpi Rust agent: a persistent, context-injected goal the model keeps advancing turn over turn"
readme = "README.md"
keywords = ["rpi", "goal", "objective", "autonomous", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
rpi-plugin-sdk = { path = "../../crates/rpi-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
