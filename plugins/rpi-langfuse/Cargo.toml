[package]
publish = false
name = "rpi-langfuse"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Langfuse tracing, scoring, and prompt management tools for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "langfuse", "tracing", "observability", "llm"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
rpi-plugin-sdk = { path = "../../crates/rpi-plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
compile-time = []
