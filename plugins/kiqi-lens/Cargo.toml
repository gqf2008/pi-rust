[package]
publish = false
name = "kiqi-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded local code diagnostics extension for the ki Rust agent"
readme = "README.md"
keywords = ["ki", "lint", "diagnostics", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
kiqi-plugin-sdk = { path = "../../crates/kiqi-plugin-sdk" }
serde_json = { workspace = true }
wait-timeout = { workspace = true }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
compile-time = []
