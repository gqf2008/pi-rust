[package]
publish = false
name = "rpi-websearch"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Public web search tool for the rpi Rust agent"
readme = "README.md"
keywords = ["rpi", "web", "search", "plugin"]
categories = ["command-line-utilities"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kiqi-plugin = { path = "../../crates/kiqi-plugin" }
rpi-plugin-sdk = { path = "../../crates/rpi-plugin-sdk" }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
url = { workspace = true }

[features]
# Set by the `ki` binary: keeps the cdylib `#[no_mangle]` entrypoint out of the
# rlib, so linking several plugins into one executable cannot collide on it.
# Left off when the plugin is built standalone (the `ki dev` cdylib channel).
compile-time = []
