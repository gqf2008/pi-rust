[package]
publish = false
name = "kiqi-lens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "kiqi-lens ported to the kiqi wasm ABI (exec capability, project cwd scope)"
readme = "README.md"
keywords = ["ki", "kiqi", "wasm", "extension", "lint", "diagnostics"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib"]

[dependencies]
kiqi-wasm-bindings = { path = "../kiqi-wasm-bindings" }
serde_json = "1"
