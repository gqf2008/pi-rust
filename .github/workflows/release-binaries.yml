name: Release binaries

# Builds prebuilt `ki` binaries and attaches them to the GitHub Release for a
# tag. This is what makes `curl -fsSL .../install.sh | sh` work and what removes
# the "you need a Rust toolchain and a C linker" barrier to trying the CLI.
#

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.4.7)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # GitHub-hosted arm64 Linux runners; available for public repos.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Cross-compiled on the arm64 image: the `macos-15-intel` runner
          # needed ~28 minutes to get through the dependency graph and was
          # killed twice (exit 68, no compiler error) before reaching signing.
          # Apple's toolchain cross-links x86_64 fine from arm64 (4 minutes on a
          # laptop), and codesign/productsign/notarytool are architecture
          # agnostic — only the smoke test needs Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "kiqi-cli") | .version' | head -n 1)"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not determine the kiqi-cli workspace version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building kiqi ${version} for ${{ matrix.target }}"

      - name: Build release binary
        run: cargo build -p kiqi-cli --release --locked --target ${{ matrix.target }}

      # Every matrix entry is executable on its runner (ubuntu-latest, ubuntu-24.04-arm,
      # macos-latest, windows-latest); the one cross-compiled target — x86_64-apple-darwin
      # on the arm64 image — runs under Rosetta when the image has it. Only one of them used to be: a binary that cannot
      # start (bad dynamic linking, a missing runtime dependency) would have been uploaded
      # and only failed on a user's machine. `--version` is the cheapest thing that proves
      # the process loads and reaches main().
      - name: Smoke test the release binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/ki"
          if [ -f "${bin}.exe" ]; then bin="${bin}.exe"; fi
          # Kept as a bare command line (not `if ! "${bin}" --version`): the
          # release-target check in scripts/ recognises the smoke test by that
          # exact shape, and wrapping it in `if !` made the check report "builds
          # release binaries but never executes one".
          set +e
          "${bin}" --version
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 0 ]; then
            # A cross-compiled binary needs Rosetta on the arm64 runner. When
            # the image lacks it, report that instead of failing a good build.
            if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
              echo "note: cannot execute ${bin} on this runner (no Rosetta); staging it unsigned-smoke" >&2
            else
              exit 1
            fi
          fi
          echo "smoke test passed for ${{ matrix.target }}"

      - name: Sign and notarize (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12}" || -z "${APPLE_ID}" || -z "${APPLE_APP_PASSWORD}" ]]; then
            echo "Apple signing secrets are not configured for this repository." >&2
            exit 1
          fi
          bin="target/${{ matrix.target }}/release/ki"
          keychain="${RUNNER_TEMP}/ki-signing.keychain-db"
          keychain_password="$(uuidgen)"
          identity="Developer ID Application: qingfeng gao (${APPLE_TEAM_ID})"

          printf '%s' "${CERT_P12}" | base64 -D > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          # productsign needs the same access as codesign: the p12 carries the
          # Developer ID *Installer* identity too, and it is imported here.
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')

          codesign --force --timestamp --options runtime --keychain "${keychain}" \
            --sign "${identity}" "${bin}"
          codesign --verify --strict --verbose=2 "${bin}"

          # notarytool only accepts an archive. A bare Mach-O cannot carry a
          # stapled ticket, so the submit is what matters: Gatekeeper then
          # validates the signed binary against Apple's notary service online.
          ditto -c -k --keepParent "${bin}" "${RUNNER_TEMP}/notarize.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarize.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${bin}" \
            || echo "note: stapler does not apply to a bare executable"
          xcrun stapler validate "${bin}" || true

          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/notarize.zip"

          # A bare Mach-O cannot carry a stapled ticket, but a .pkg can - which
          # is what makes a macOS install verifiable without asking Apple.
          # Built here because the signing keychain is still unlocked, and the
          # p12 also carries the Developer ID *Installer* identity.
          version="${{ steps.version.outputs.version }}"
          pkgroot="${RUNNER_TEMP}/pkgroot"
          mkdir -p "${pkgroot}/usr/local/bin"
          cp "${bin}" "${pkgroot}/usr/local/bin/ki"
          pkg="${PWD}/ki-v${version}-${{ matrix.target }}.pkg"
          pkgbuild --root "${pkgroot}" --identifier "la.kiqi.ki" \
            --version "${version}" --install-location "/" \
            "${RUNNER_TEMP}/ki-unsigned.pkg"
          productsign \
            --sign "Developer ID Installer: qingfeng gao (${APPLE_TEAM_ID})" \
            --keychain "${keychain}" \
            "${RUNNER_TEMP}/ki-unsigned.pkg" "${pkg}"
          pkgutil --check-signature "${pkg}"
          xcrun notarytool submit "${pkg}" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${pkg}"
          xcrun stapler validate "${pkg}"
          shasum -a 256 "${pkg}" > "${pkg}.sha256"

          security delete-keychain "${keychain}" || true

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="ki-v${version}-${target}"
          mkdir -p dist

          if [[ "${target}" == *windows* ]]; then
            bin="target/${target}/release/ki.exe"
          else
            bin="target/${target}/release/ki"
          fi

          if [[ ! -f "${bin}" ]]; then
            echo "expected binary at ${bin} but it is missing" >&2
            exit 1
          fi

          cp "${bin}" dist/
          cp LICENSE dist/ 2>/dev/null || true
          cp NOTICE dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "../${name}.zip" . >/dev/null)
            asset="${name}.zip"
          else
            tar -czf "${name}.tar.gz" -C dist .
            asset="${name}.tar.gz"
          fi

          # Publish a checksum next to every archive so install.sh can verify it.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${asset}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.stage.outputs.asset }}
            ${{ steps.stage.outputs.checksum }}
            *.pkg
            *.pkg.sha256
          if-no-files-found: error

  release:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "kiqi ${TAG}" \
              --generate-notes
          fi
