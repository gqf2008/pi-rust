name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test PowerShell installer offline (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/tests/install.Tests.ps1

      - name: Test PowerShell installer offline (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/tests/install.Tests.ps1

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          # The extension-host e2e test builds the conformance guest component.
          targets: wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify embedded docs are in sync
        run: |
          sh scripts/sync-embedded-docs.sh
          if ! git diff --exit-code -- crates/kiqi-cli/embedded-docs; then
            echo "::error::crates/kiqi-cli/embedded-docs is out of sync with the repository documents. Run 'sh scripts/sync-embedded-docs.sh' and commit the result."
            exit 1
          fi

      - name: Verify the ABI section numbers and their citations
        run: sh scripts/check-abi-sections.sh

      # `windows-check` ran `cargo check --workspace --all-targets` without `--locked`
      # while the other three jobs pinned it. Both forms read as "check the workspace",
      # but unpinned the resolver can pick versions absent from Cargo.lock, so a red X
      # no longer names a commit.
      - name: Verify every CI cargo command pins the lock file
        run: sh scripts/check-ci-locked.sh

      # Four lists name the same target triples: the release matrix (producer) and
      # `release_target_triple`, `install.sh`, `install.ps1` (consumers). Nothing tied
      # them together, so adding a target to one side yields either a release no install
      # path asks for, or a 404 on a platform the project claims to support.
      - name: Verify the release targets agree across producer and consumers
        run: sh scripts/check-release-targets.sh

      # Both installers show a version in their own help text, and both used to name one
      # this repository never released (`--version 0.3.0`, `-Version 0.3.19`) -- a
      # copy-pasteable 404. Must ask what was *released*, not what was tagged: local tags
      # include v0.3.0/v0.3.19, which is why a tag-based check missed this.
      - name: Verify the installers only suggest released versions
        # The release list is read from api.github.com. Without a token that is
        # 60 requests/hour per IP; a rate-limited runner would fail this gate
        # for a reason unrelated to the commit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/check-install-version-hints.sh

      # The lock file must name every dependency of every feature. CI is online, so a
      # missing entry would simply be fetched here — while an offline build (and this
      # machine, whose uncommitted `.cargo/config.toml` sets `offline = true`) fails
      # with what looks like a local misconfiguration.
      - name: Verify the lock file covers every feature offline
        run: sh scripts/check-offline-lock.sh

      # `install.sh` is the `curl | sh` entry point and had no test in any job: the
      # PowerShell twin is covered by `scripts/tests/install.Tests.ps1` in the
      # Windows job, but nothing exercised the Unix half. Runs offline — the script's
      # `--dry-run --version` path prints the platform/version/URL and exits.
      - name: Test install.sh platform detection
        run: sh scripts/tests/install-sh.sh

      # `release.sh` orchestrates the release workflow, so it has to agree with it:
      # the asset names it polls for and the remote it pushes to. Both were fixed
      # (the poll uses `ki-v…`; the push uses `fork`, never `origin` = bigfish1913).
      - name: Test release.sh against the release workflow
        run: sh scripts/tests/release-sh.sh

      # Every crate is `publish = false` and README says so, yet it used to carry
      # crates.io badges, a `cargo install kiqi-cli` quick-start, crates.io crate
      # links and a "docs.rs page" claim — all of which fail for a user who follows them.
      - name: Test the README's install instructions against the manifests
        run: sh scripts/tests/docs-install-path.sh

      - name: Verify the per-agent collab setup script
        run: sh scripts/tests/setup-collab-agents.sh

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked

      # Every feature in the workspace, not the default set. A declared feature that
      # does not compile is invisible otherwise: `kiqi-tools`'s `webp` called
      # `WebPEncoder::new_with_quality`/`WebPQuality`, which `image` 0.25 does not
      # have, so `cargo build --features webp` failed — and nothing ever enabled it.
      - name: Check the workspace builds with every feature
        run: cargo check --workspace --all-targets --all-features --locked

      # Crates whose tests are gated behind a non-default feature. `cargo test -p
      # kiqi-ai` alone compiles 49 tests instead of 208 (the whole anthropic provider
      # is `cfg(feature = "providers")`), so running only that package silently skips
      # the provider suite; the workspace run covers it by feature unification, but
      # these crates are where the gaps live.
      #
      # The `--all-features` step above only *checks* the workspace, so a
      # feature-gated test that fails to compile or fails at runtime stays
      # invisible. (`kiqi-extension-sdk` used to be listed here; the crate went
      # away with the cdylib channel on 2026-10-26.)
      - name: Test the crates whose tests need non-default features
        run: >
          cargo test -p kiqi-ai -p kiqi-tools --lib --locked
          --all-features

      # Guests build for `wasm32-wasip2`, but wit-bindgen also generates host
      # stubs, so their pure-logic unit tests run natively here.
      - name: Test wasm guests' native unit tests
        run: cargo test --manifest-path extensions/wasm/Cargo.toml -p kiqi-plan-mode --locked


  # Compile the workspace on Windows. Nothing else did: the release matrix is
  # the only place that built for Windows, so a Windows-only compile error
  # surfaced there and blocked the release (v0.4.0 failed with `cannot find
  # function windows_paths_equal` - a function gated with #[cfg(test)] while
  # clearing a dead-code warning that was really a platform artifact; macOS
  # stayed green throughout).
  #
  # Runs on a real Windows runner rather than cross-checking, because native
  # dependencies (ring) build C sources and need a Windows toolchain.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      - name: Check the workspace compiles on Windows
        # `--locked` matters here more than anywhere else: without it this job lets the
        # resolver pick newer dependency versions than every other job and than the
        # committed Cargo.lock, so a red X could mean "an unrelated crate published a
        # Windows-breaking release" rather than "this commit broke Windows".
        run: cargo check --workspace --all-targets --locked

  # Every other job runs whatever `@stable` currently is (1.99 at the time of
  # writing), so `rust-version` in `[workspace.package]` was never exercised: it sat
  # at 1.78 while `wasmtime 49` → cranelift already required 1.96. This job reads the
  # declared value and builds the workspace with exactly that toolchain, so the
  # number cannot drift from reality again.
  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "declared=$version" >> "$GITHUB_OUTPUT"
          echo "Building with the declared MSRV: $version"

      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.declared }}

      - name: Check the workspace against the declared MSRV
        run: cargo check --workspace --locked
