name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test PowerShell installer offline (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/tests/install.Tests.ps1

      - name: Test PowerShell installer offline (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/tests/install.Tests.ps1

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify embedded docs are in sync
        run: |
          sh scripts/sync-embedded-docs.sh
          if ! git diff --exit-code -- crates/rpi-cli/embedded-docs; then
            echo "::error::crates/rpi-cli/embedded-docs is out of sync with the repository documents. Run 'sh scripts/sync-embedded-docs.sh' and commit the result."
            exit 1
          fi

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked

  release:
    name: Publish crates.io release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure crates.io authentication
        shell: bash
        env:
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN || secrets.CARGO_TOKEN }}
        run: |
          if [[ -z "${SECRET_TOKEN}" ]]; then
            echo "Add the CARGO_REGISTRY_TOKEN repository secret before enabling automatic crates.io publishing." >&2
            exit 1
          fi
          echo "::add-mask::${SECRET_TOKEN}"
          echo "CARGO_REGISTRY_TOKEN=${SECRET_TOKEN}" >> "${GITHUB_ENV}"

      - name: Read workspace release version
        id: release
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rpi-cli") | .version' | head -n 1)"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not determine the rpi-cli workspace version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Publishing workspace version ${version}."

      - name: Build release helper
        run: rustc --edition=2021 release-helper.rs -o .git/rpi-release-helper

      - name: Validate release state
        run: .git/rpi-release-helper validate "${{ steps.release.outputs.version }}"

      - name: Publish crates in dependency order
        run: .git/rpi-release-helper publish "${{ steps.release.outputs.version }}"

  # Compile the workspace on Windows. Nothing else did: the release matrix is
  # the only place that built for Windows, so a Windows-only compile error
  # surfaced there and blocked the release (v0.4.0 failed with `cannot find
  # function windows_paths_equal` - a function I gated with #[cfg(test)] while
  # clearing a dead-code warning that was really a platform artifact; macOS
  # stayed green throughout).
  #
  # Runs on a real Windows runner rather than cross-checking, because native
  # dependencies (ring) build C sources and need a Windows toolchain.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      - name: Check the workspace compiles on Windows
        run: cargo check --workspace --all-targets
