name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test PowerShell installer offline (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/tests/install.Tests.ps1

      - name: Test PowerShell installer offline (PowerShell Core)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/tests/install.Tests.ps1

  test:
    name: Cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          # The plugin-host e2e test builds the conformance guest component.
          targets: wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify embedded docs are in sync
        run: |
          sh scripts/sync-embedded-docs.sh
          if ! git diff --exit-code -- crates/kiqi-cli/embedded-docs; then
            echo "::error::crates/kiqi-cli/embedded-docs is out of sync with the repository documents. Run 'sh scripts/sync-embedded-docs.sh' and commit the result."
            exit 1
          fi

      - name: Verify the documented gate matches this workflow
        run: sh scripts/check-feature-parity.sh

      - name: Verify the ABI section numbers and their citations
        run: sh scripts/check-abi-sections.sh

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked

      # Every plugin with a wasm port is opt-in now, so the default build never
      # compiles their registration paths (nor the tests that exercise them).
      # Run those tests explicitly or the features rot unseen.
      - name: Test the opt-in plugin features
        run: >
          cargo test -p kiqi-cli --lib --locked
          --features plugin-kiqi-todo,plugin-kiqi-lens,plugin-kiqi-webfetch,plugin-kiqi-websearch,plugin-kiqi-subagents,plugin-kiqi-goal,plugin-kiqi-plan-mode,plugin-kiqi-ask-user,plugin-kiqi-langfuse,plugin-kiqi-permissions,plugin-kiqi-codegraph,plugin-kiqi-orchestrator

      # The workspace build links every plugin into `ki`, which enables each
      # plugin's `compile-time` feature and so drops its cdylib entrypoint. This
      # builds the plugins standalone, where that feature is off, keeping the
      # `ki dev` cdylib export compiled (and linked) on a Linux toolchain.
      - name: Build each plugin as a standalone cdylib
        run: |
          cargo build --locked \
            -p kiqi-todo -p kiqi-lens -p kiqi-webfetch -p kiqi-websearch \
            -p kiqi-subagents -p kiqi-permissions -p kiqi-goal -p kiqi-plan-mode \
            -p kiqi-codegraph -p kiqi-ask-user -p kiqi-langfuse -p kiqi-orchestrator

  # Compile the workspace on Windows. Nothing else did: the release matrix is
  # the only place that built for Windows, so a Windows-only compile error
  # surfaced there and blocked the release (v0.4.0 failed with `cannot find
  # function windows_paths_equal` - a function gated with #[cfg(test)] while
  # clearing a dead-code warning that was really a platform artifact; macOS
  # stayed green throughout).
  #
  # Runs on a real Windows runner rather than cross-checking, because native
  # dependencies (ring) build C sources and need a Windows toolchain.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      - name: Check the workspace compiles on Windows
        run: cargo check --workspace --all-targets

  # Every other job runs whatever `@stable` currently is (1.99 at the time of
  # writing), so `rust-version` in `[workspace.package]` was never exercised: it sat
  # at 1.78 while `wasmtime 49` → cranelift already required 1.96. This job reads the
  # declared value and builds the workspace with exactly that toolchain, so the
  # number cannot drift from reality again.
  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          echo "declared=$version" >> "$GITHUB_OUTPUT"
          echo "Building with the declared MSRV: $version"

      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.declared }}

      - name: Check the workspace against the declared MSRV
        run: cargo check --workspace --locked
